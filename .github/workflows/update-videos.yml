name: 최근 설교 영상 갱신

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 유튜브 채널에서 최근 영상 읽기
        run: python3 scripts/update_videos.py
      - name: 바뀐 내용이 있으면 저장
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "새 영상이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "최근 설교 영상 목록 갱신"
          git push
